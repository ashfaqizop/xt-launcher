[package]
name = "xt-launcher"
version = "0.1.3"
description = "XT Launcher - a clean, fast Minecraft Java launcher"
authors = ["XT"]
edition = "2021"

[lib]
name = "xt_launcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
keyring = { version = "3", features = ["windows-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

# A conventional optimised build. The previous size-squeezed profile (opt-level "s",
# stripped, panic=abort) made Windows Defender's ML scanner flag the app as a trojan.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = false
