name: Release

# Push a tag like v0.1.0 (matching src-tauri/tauri.conf.json "version") to build
# a signed NSIS installer and the latest.json the in-app updater reads. Releases are
# created as DRAFTS: nothing is public (and no one is offered the update) until the
# draft is published on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: XT Launcher ${{ github.ref_name }}
          releaseBody: See the assets below to download and install XT Launcher.
          releaseDraft: true   # drafts stay private until you press Publish on GitHub
          prerelease: false
          uploadUpdaterJson: true
